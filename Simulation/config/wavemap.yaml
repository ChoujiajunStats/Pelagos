# Initial LAS2-S mapping settings. Camera geometry and output paths are filled
# from this run's calibration in prepare_scene.py; no spatial crop is applied.
/**:
  ros__parameters:
    min_cell_width_m: 0.10
    tree_height: 6
    min_range_m: 0.30
    max_range_m: 8.0
    pixel_stride: 2
    integration_rate_hz: 10.0
    integration_threads: 4
    publish_rate_hz: 5.0
    prune_period_s: 10.0
    max_pose_gap_s: 0.10
    pose_wait_timeout_s: 0.30
    range_sigma_m: 0.10
    scaling_free: 0.20
    scaling_occupied: 0.40
    occupied_probability: 0.70
    depth_edge_absolute_m: 0.15
    depth_edge_relative: 0.05
    depth_topic: /stereo/mapping_depth
    odom_topic: /odometry/estimated
    world_frame: world
    camera_frame: cam0_rect_optical
