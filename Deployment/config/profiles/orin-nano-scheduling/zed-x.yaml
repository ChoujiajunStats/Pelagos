/**:
  ros__parameters:
    general:
      self_calib: false
      grab_resolution: HD1200
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      pub_frame_rate: 30.0
      sdk_use_monotonic_clock: true
    video:
      publish_rgb: false
      publish_left_right: true
      publish_raw: true
      publish_gray: true
      publish_stereo: false
    sensors:
      sensors_pub_rate: 200.0
      sensors_image_sync: false
      publish_imu: false
      publish_imu_raw: true
      publish_cam_imu_transf: false
      publish_mag: false
      publish_baro: false
      publish_temp: false
    depth:
      depth_mode: NONE
      publish_depth_map: false
      publish_depth_info: false
      publish_depth_confidence: false
      publish_point_cloud: false
      publish_disparity: false
    pos_tracking:
      pos_tracking_enabled: false
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    body_tracking:
      bt_enabled: false
